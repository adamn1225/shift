name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-python-package:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For trusted publishing to PyPI
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    needs: [build-python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases
    steps:
      - uses: actions/checkout@v3
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            install-unix.sh
            install.ps1
            README.md
            CHANGELOG.md
          body: |
            ## 🚀 Shift CLI v${{ github.ref_name }}
            
            ### ✨ What's New in v1.0.2
            - **Enhanced Text-to-HTML Conversion**: Beautiful, professional HTML output with proper paragraph formatting
            - **Intelligent Paragraph Detection**: Automatically converts text to structured HTML with `<p>` tags
            - **Company Entry Formatting**: Special styling for business listings with highlighted names and contact info
            - **Modern CSS Styling**: Professional typography, colors, and responsive design
            - **Improved Document Structure**: Semantic HTML elements for better readability
            
            ### 📥 Installation Options:
            
            **🐍 Python (Recommended - All Platforms)**
            ```bash
            pip install shift
            ```
            
            **🐧 Linux (Ubuntu/Debian)**
            ```bash
            curl -sSL https://raw.githubusercontent.com/adamn1225/shift/main/install-unix.sh | bash
            ```
            
            **🍎 macOS**
            ```bash
            pip install shift
            # OR
            curl -sSL https://raw.githubusercontent.com/adamn1225/shift/main/install-unix.sh | bash
            ```
            
            ### � Usage Examples
            
            **Convert with enhanced formatting:**
            ```bash
            shift-convert document.txt --to html  # Now produces beautiful, structured HTML!
            shift-convert report.md --to pdf --css professional.css
            shift-compress large-file.pdf  # Compress for email
            shift-ocr scanned-doc.pdf --extract-text
            ```
            
            ### 📋 Available Commands
            - `shift-convert` - Document conversion with improved HTML output
            - `shift-compress` - PDF compression for email attachments
            - `shift-pages` - PDF page management and analysis
            - `shift-edit` - Advanced PDF editing (CLI and GUI)
            - `shift-ocr` - OCR text extraction from scanned documents
            
            Perfect for business documents, reports, and professional document processing!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
